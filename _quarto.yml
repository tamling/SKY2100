project:
  type: book
  output-dir: _site
  resources:
    - robots.txt
  render:
    - "*.qmd"
    - "appendix/*.qmd"
    # Answer keys are source-only: answers/ is excluded from every render,
    # so no answer ever appears on the published site. Keys are exported to
    # Canvas via canvas-export/make_canvas_quiz.py instead.
    - "!answers/"

# ── Annotations (Hypothesis) ─────────────────────────────────────────────
# ON by default: every HTML page loads the Hypothesis client (see
# includes/hypothesis.html) so students can annotate directly. Set to
# false (and drop include-in-header below) to switch the layer off again;
# pages read the flag as {{< meta annotations >}} to show/hide
# annotation instructions.
annotations: true

book:
  title: "SKY2100 — Course Script"
  # Each chapter ends with a "Self-check" section — see
  # _templates/chapter-self-check.qmd for the required format.
  chapters:
    - index.qmd
    - chapters/01-cloud-information-security.qmd
    - chapters/02-data-centres-virtualisation-linux.qmd
    - chapters/03-web-services-load-dos.qmd
    - chapters/04-networking-firewalls.qmd
    - chapters/05-cloud-native-lift-and-shift.qmd
    - chapters/06-tls-data-in-transit.qmd
    - chapters/07-hardening-access-control.qmd
    - chapters/08-devsecops-waf.qmd
    - chapters/09-monitoring-ids.qmd
    - chapters/10-logging-log-integrity.qmd
    - chapters/11-resilience-raid-backup.qmd
    - chapters/12-incident-response-bcm.qmd
    - chapters/13-integrated-case.qmd
    - part: labs/index.qmd
      chapters:
        - labs/exercise-01.qmd
        - labs/exercise-02.qmd
        - labs/exercise-03.qmd
        - labs/exercise-04.qmd
        - labs/exercise-05.qmd
        - labs/exercise-06.qmd
        - labs/exercise-07.qmd
        - labs/exercise-08.qmd
        - labs/exercise-09.qmd
        - labs/exercise-10.qmd
        - labs/exercise-11.qmd
        - labs/exercise-12.qmd
        - labs/exercise-13.qmd
  appendices:
    - appendix/reading-list.qmd
    - appendix/how-to-annotate.qmd

format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [darkly, theme-dark.scss]
    toc: true
    number-sections: true
    include-in-header:
      - includes/hypothesis.html
      # noindex while the site is unofficial — remove with robots.txt
      - includes/noindex.html
