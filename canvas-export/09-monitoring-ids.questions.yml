quiz_title: "Chapter 09 - Self-check"
chapter: 09-monitoring-ids

questions:
  - id: q1
    type: mcq
    section: sec-09-monitoring-cloud
    difficulty: basic
    text: "Why does speed matter most among the complexities of cloud monitoring?"
    options:
      - "Because cloud providers delete telemetry after a few minutes, so it must be read at once"
      - "Because attacks on cloud systems are often scripted, so data can be stolen or exposed within seconds or minutes of the first break-in"
      - "Because the management plane throttles slow queries, making delayed analysis impossible"
      - "Because the shared-responsibility model requires the customer to report incidents to the provider in real time"
    correct: 2

  - id: q2
    type: mcq
    section: sec-09-events-alerts-telemetry
    difficulty: basic
    text: "What does the Target 2013 case illustrate about monitoring?"
    options:
      - "Anomaly detection produces too many false positives to be useful in retail"
      - "Third-party contractors should never be given network access"
      - "Detection is half the task: an alert nobody responds to is no better than no alert"
      - "Point-of-sale systems cannot be monitored with management plane logs"
    correct: 3

  - id: q3
    type: mcq
    section: sec-09-detection
    difficulty: basic
    text: "Which statement correctly distinguishes an IDS from an IPS?"
    options:
      - "An IDS sits inline and blocks malicious traffic; an IPS observes a copy and alerts"
      - "An IDS observes a copy of the traffic out-of-band and raises alerts; an IPS sits inline and can block traffic, at the risk of blocking a real user on a false positive"
      - "An IDS works only by signature; an IPS works only by anomaly"
      - "An IDS is a cloud service; an IPS is always a physical appliance"
    correct: 2

  - id: q4
    type: short
    section: sec-09-detection
    difficulty: basic
    text: "In one or two sentences: what is the cascade-and-filter pattern, and which two purposes does it serve?"
    answers:
      - "a sequence of detection mechanisms, each narrowing the data further"
      - "filters from broadly suspicious toward known attack patterns to a confirmed alert"
      - "turns many events into few alerts and manages cost"
      - "most raw logs stay cheaply in place, only pertinent alerts go to the security team"

  - id: q5
    type: short
    section: sec-09-detection
    difficulty: basic
    text: "Name two of the key indicators or detectors the Guidance says to watch closely on the management plane and identity systems."
    answers:
      - "unauthorised API calls"
      - "management console logins without MFA"
      - "any IAM policy change"
      - "any use of the root account"
      - "unusual IAM or network security activity, especially in unused regions"

  - id: q6
    type: mcq
    section: sec-09-detection
    difficulty: basic
    text: "Why does the simple monitoring loop - poll every instance, alert if one fails to respond - not fit cloud-native applications?"
    options:
      - "Cloud providers forbid polling because it consumes API quota"
      - "Cloud-native instances start and stop all the time under the orchestrator's control, so a disappearing instance is not by itself a sign of trouble"
      - "The loop is too fast: thirty seconds is shorter than the fast path requires"
      - "Cloud-native applications run a known number of instances in known places, so polling is redundant"
    correct: 2

  - id: q7
    type: applied
    section: sec-09-exercises
    difficulty: applied
    text: >
      Building on the "The canary token" exercise: the Nextcloud team's
      analysts are drowning in alerts, most of them false positives, and
      worry they would miss a real intrusion. Propose a design that adds one
      canary to the deployment and routes its alerts appropriately: say what
      the canary is, why any access to it is almost certainly malicious,
      whether its alert belongs on the fast path or the slow path and why,
      and name one other key indicator from this chapter you would put on
      the same path. Justify each choice with a concept from this chapter.
    sample_answer: >
      A decoy such as a fake admin_passwords.txt file or an unused decoy user
      account in Nextcloud; since no legitimate process ever touches it, any
      interaction indicates an attempted or actual breach, giving almost no
      false positives. Its alert belongs on the fast path, because a
      triggered canary is high-risk activity and the slow path's delay of up
      to fifteen minutes is too long; fast-path events become alerts almost
      at once. On the same path: another key indicator such as management
      console logins without MFA, an IAM policy change, root account use, or
      impossible-travel logins. Grading: full credit needs a plausible
      canary, the no-legitimate-access argument, fast path with the
      timeliness justification, and one correct key indicator; partial
      credit for three of the four.
