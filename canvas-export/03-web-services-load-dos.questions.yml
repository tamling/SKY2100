# Questions file for chapters/03-web-services-load-dos.qmd.
# Content matches the chapter's Self-check section and
# answers/03-web-services-load-dos.qmd exactly (same numbering).
quiz_title: "Chapter 03 — Self-check"
chapter: 03-web-services-load-dos

questions:
  - id: q1
    type: mcq
    section: sec-03-web-services-capacity
    difficulty: basic
    text: "How does this chapter say a web server's capacity should be established?"
    options:
      - "By estimation from the hardware specifications"
      - "By measurement: pushing the service until it strains"
      - "By reading the provider's SLA for the machine"
      - "By counting the number of worker processes"
    correct: 2

  - id: q2
    type: mcq
    section: sec-03-denial-of-service
    difficulty: basic
    text: >
      A SYN flood, measured in packets per second, exhausts connection state
      in servers or firewalls. Which DDoS type is this?
    options:
      - "Volumetric"
      - "Protocol"
      - "Application-layer"
      - "Amplification"
    correct: 2

  - id: q3
    type: mcq
    section: sec-03-scaling-out
    difficulty: basic
    text: "Which statement about scaling matches the chapter?"
    options:
      - "Scaling up to one ever-larger machine proved cheaper and more resilient than scaling out"
      - "Scaling out places a cluster of identical commodity servers behind a load balancer, and proved cheaper and more resilient than scaling up"
      - "A load balancer adds capacity but removes resilience, because it is a single point of failure"
      - "Autoscaling requires servers that are individually configured and therefore not interchangeable"
    correct: 2

  - id: q4
    type: short
    section: sec-03-sla
    difficulty: basic
    text: >
      In one or two sentences: why does a solution built from many chained
      components have a lower combined SLA than any single component?
    answers:
      - "the availabilities multiply"
      - "chaining multiplies the availabilities, so the product is lower than any factor"
      - "every request needs all components, so their availabilities multiply down"
      - "combined availability is the product of the components' availabilities"

  - id: q5
    type: short
    section: sec-03-minimum-viable-network
    difficulty: basic
    text: >
      In one or two sentences: in a minimum viable network, which connections
      may each tier accept, and what happens to everything not explicitly
      permitted?
    answers:
      - "only from the tier directly above it, on the ports that tier uses; everything else is dropped"
      - "each tier accepts connections only from the tier above, and everything not explicitly permitted is dropped"
      - "only the tier above on its ports; the rest is dropped (default-deny)"

  - id: q6
    type: mcq
    section: sec-03-laboratory
    difficulty: basic
    text: >
      Why does the laboratory install apache2-utils even though the service
      being tested is Nginx?
    options:
      - "Nginx cannot serve a welcome page without Apache installed"
      - "Apache is required as a reverse proxy in front of Nginx"
      - "The load-testing tool ab ships with Apache's utilities"
      - "The access log format is defined by the Apache project"
    correct: 3

  - id: q7
    type: applied
    section: sec-03-defending-in-layers
    difficulty: applied
    text: >
      Building on the exercise "An application-layer flood": your Nextcloud
      VM's search endpoint, whose wall you have measured with ab, starts
      receiving a steady stream of plausible-looking queries and response
      times climb towards the wall. Describe the layered response you would
      take on the customer's side of the split: name two concrete server-side
      controls from this chapter (one of them the Nginx directive), explain
      what each does against this specific attack type, and state which
      evidence — from the load-measurement tools — you would use to verify
      that the controls worked.
    sample_answer: >
      Application-layer flood, so the customer's own configuration carries
      the weight. Controls: (1) rate limiting via the Nginx limit_req
      directive, capping requests per client where the cost arises; (2)
      caching, which serves repeated content cheaply and raises the effective
      capacity of the expensive path (timeouts/connection limits also
      acceptable). Verification: re-run ab and compare failed-request count,
      requests per second and time per request before/after; watch CPU and
      memory in htop/btop stay below the wall; check
      /var/log/nginx/access.log for capped requests. Grading: two correct
      customer-side controls incl. limit_req + per-control explanation tied
      to the attack type + at least two pieces of verification evidence.
