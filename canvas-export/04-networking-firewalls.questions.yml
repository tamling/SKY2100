quiz_title: "Chapter 04 — Self-check"
chapter: 04-networking-firewalls

questions:
  - id: q1
    type: mcq
    section: sec-04-addresses-ports-attack-surface
    difficulty: basic
    text: "Which of the following does the pair (IP address, port) identify?"
    options:
      - "One machine on a network"
      - "One service on one machine"
      - "One tenant's virtual network on the shared fabric"
      - "One rule in a firewall's rule list"
    correct: 2

  - id: q2
    type: mcq
    section: sec-04-cloud-networks-software
    difficulty: basic
    text: "Which statement about security groups and network access control lists (NACLs) is correct?"
    options:
      - "Security groups are stateful and attach to resources; NACLs are typically stateless and apply to subnets"
      - "Security groups are stateless and apply to subnets; NACLs are stateful and attach to resources"
      - "Both are stateless, so replies to permitted outgoing requests always need their own rule"
      - "Both apply only to subnets and differ merely in the provider that offers them"
    correct: 1

  - id: q3
    type: short
    section: sec-04-cloud-networks-software
    difficulty: basic
    text: >
      In one or two sentences: how does the default position of an Azure
      network security group differ from the default position of an AWS
      security group, and why must an administrator know which applies?
    answers:
      - "aws denies all inbound by default, azure allows traffic within the virtual network by default"
      - "azure allows east-west traffic inside the vnet while denying inbound from the internet; aws starts from deny-all"
      - "aws deny-all, azure open within the virtual network; assuming the wrong default leaves a service reachable"
      - "know the default before trusting it: aws blocks even same-group traffic until allowed, azure permits intra-vnet traffic"

  - id: q4
    type: mcq
    section: sec-04-the-firewall
    difficulty: basic
    text: "Under a default-deny (allow-list) firewall policy, which of the following holds?"
    options:
      - "Everything not explicitly forbidden is allowed, so unforeseen traffic passes"
      - "All incoming and outgoing traffic is blocked without exception"
      - "Only traffic that an explicit rule permits gets through; the final catch-all rule blocks the rest"
      - "Replies to connections the host opened outward are dropped unless a separate inbound rule permits them"
    correct: 3

  - id: q5
    type: short
    section: sec-04-firewall-types-ngfw-waf
    difficulty: basic
    text: >
      Name two capabilities of a next-generation firewall (NGFW) that a plain
      stateful firewall such as ufw or a cloud security group does not have.
    answers:
      - "deep packet inspection"
      - "identifies the application in a flow"
      - "rules by user identity"
      - "integrated intrusion prevention"
      - "threat-intelligence feeds of known-bad addresses and domains"

  - id: q6
    type: mcq
    section: sec-04-defence-in-depth-zero-trust
    difficulty: basic
    text: "Which option best describes the Zero Trust strategy?"
    options:
      - "A hard perimeter with a demilitarised zone exposes only a few chosen servers, and the interior is trusted"
      - "Nobody and nothing is trusted merely for its position on the network; every user, device, application and transaction is checked again and again, assuming breach"
      - "All requests from outside the network are denied permanently, while internal traffic flows freely"
      - "Trust is granted once at login and retained for the lifetime of the session"
    correct: 2

  - id: q7
    type: applied
    section: sec-04-the-firewall
    difficulty: applied
    text: >
      Building on the chapter exercise "SSH brute force as
      threat-risk-control": your team's VM runs Nginx on port 80 and SSH on
      port 22, and a colleague has additionally opened the database port 5432
      "temporarily, for testing" and left it open. The VM sits in an Azure
      virtual network alongside other team resources. Using the chapter's
      three common firewall mistakes and the discussion of provider defaults,
      identify every way this machine is more exposed than it should be, and
      give the full ufw command sequence (including the rule from the
      exercise) that establishes the intended default-deny policy.
    sample_answer: >
      Exposures: (i) the forgotten database port 5432 (second common
      mistake); (ii) SSH open to the whole Internet instead of only the
      administrator's address (first mistake, the brute-force risk); (iii)
      the Azure default (third mistake): NSG built-in rules allow east-west
      traffic within the virtual network, so other VNet resources may reach
      the VM even without added rules. Sequence: sudo ufw default deny
      incoming; sudo ufw default allow outgoing; sudo ufw allow from YOUR_IP
      to any port 22 proto tcp; sudo ufw allow 80/tcp; sudo ufw enable; then
      sudo ufw status to read the loaded policy back. Full credit needs all
      three exposures, the restricted SSH rule, no rule for 5432, and the
      read-back.
