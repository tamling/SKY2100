quiz_title: "Chapter 11 — Self-check"
chapter: 11-resilience-raid-backup

questions:
  - id: q1
    type: mcq
    section: sec-11-redundancy-raid
    difficulty: basic
    text: "Which of the following statements about RAID levels is correct?"
    options:
      - "RAID 0 mirrors data across disks, so a copy survives a disk failure"
      - "RAID 1 stripes data across disks for speed but adds no redundancy"
      - "RAID 5 distributes data with parity, tolerating one failed disk"
      - "RAID 6 combines several logical volumes into one physical disk"
    correct: 3

  - id: q2
    type: mcq
    section: sec-11-redundancy-raid
    difficulty: basic
    text: >
      A colleague proposes storing the team's only copy of project data on a
      RAID 5 array, arguing that the array's redundancy makes backups
      unnecessary. Which option best explains why this is incorrect?
    options:
      - "RAID 5 is less reliable than RAID 0, so a striped array should be used instead"
      - "RAID protects against a disk failing, but a deletion, corruption or ransomware encryption is copied instantly and exactly to every disk"
      - "RAID arrays cannot be rebuilt after any disk failure, so the data is already at risk"
      - "Parity data takes up so much space that there is no room left for a second copy"
    correct: 2

  - id: q3
    type: mcq
    section: sec-11-backup
    difficulty: basic
    text: >
      According to the 3–2–1 rule, which of the following describes the
      required copies of important data?
    options:
      - "Three copies, on two different kinds of media, with one copy off-site"
      - "Three backups per day, kept for two weeks, restored once"
      - "Three disks in the array, two of them mirrored, one holding parity"
      - "Three regions, two availability zones, one provider"
    correct: 1

  - id: q4
    type: short
    section: sec-11-availability-revisited
    difficulty: basic
    text: >
      In one or two sentences: what is meant by a small blast radius, and
      give one example of a design choice from this chapter that reduces it.
    answers:
      - "one failure takes down as little as possible"
      - "a single failure affects as little as possible"
      - "limit what one failure destroys; spread across availability zones"
      - "one failure has small impact; backup survives loss of storage"
      - "immutable images replace a lost instance"

  - id: q5
    type: short
    section: sec-11-backup
    difficulty: basic
    text: >
      In one or two sentences: why does the CSA Guidance require backup
      restoration testing at regular intervals?
    answers:
      - "a backup that has never been restored is not known to work"
      - "an untested backup is not a control"
      - "restore testing proves the backup actually works"
      - "only restoring proves you can recover"

  - id: q6
    type: mcq
    section: sec-11-provider-redundancy
    difficulty: basic
    text: >
      Cloud object storage keeps several geographically separated replicas
      of every object and advertises a high durability figure. Why does the
      customer's own backup nevertheless remain the customer's
      responsibility?
    options:
      - "Provider replicas are stored on RAID 0 arrays and can be lost at any time"
      - "Durability figures only apply to data centres in the customer's own region"
      - "The provider deletes replicas after a fixed retention period"
      - "Deletion, corruption and ransomware reach through provider redundancy, because replicas copy the damage exactly"
    correct: 4

  - id: q7
    type: applied
    section: sec-11-designing-for-failure
    difficulty: applied
    text: >
      Building on the chapter exercise "Data loss as threat–risk–control":
      your team runs Nextcloud with RAID 5 beneath the storage and keeps the
      Session 2 VM snapshot on the same cloud account. One morning,
      ransomware has encrypted the live data. For each of the three
      safeguards in place (RAID, snapshot, and any backup regime you would
      add), state whether it helps in this event and why, and then describe
      the backup regime this chapter says would have guaranteed recovery,
      justifying each property (location, immutability, testing) with a
      concept from the chapter.
    sample_answer: >
      RAID 5 does not help: the array copies the encryption to every disk;
      RAID buys uptime through hardware failure, not recoverability. The
      snapshot is only a rollback point and sits in the same account, so an
      attacker who can reach the account can destroy it too; it must not be
      mistaken for the backup. The decisive control is a regular backup of
      Nextcloud's data and configuration that is off-site (separate account
      or region — a backup the attacker can reach and encrypt is no backup,
      the same logic as off-host logs in Session 10), immutable (so
      ransomware cannot encrypt or delete it), and tested by restoring on a
      schedule (a backup that has never been restored is not known to work).
      Grading: verdict plus reason for each of the three safeguards, and all
      three backup properties justified from the chapter.
