quiz_title: "Chapter 05 - Self-check"
chapter: 05-cloud-native-lift-and-shift

questions:
  - id: q1
    type: mcq
    section: sec-05-two-ways-into-the-cloud
    difficulty: basic
    text: "The CSA Guidance names three migration strategies. Which of the following describes refactoring?"
    options:
      - "Moving the application unchanged onto a rented VM, with the least change"
      - "Adjusting the application to use some cloud services, without a full rebuild"
      - "Redesigning the application entirely around the cloud's own patterns"
      - "Keeping the application on-premises and renting only storage from the cloud"
    correct: 2

  - id: q2
    type: mcq
    section: sec-05-containers
    difficulty: basic
    text: "What does a container virtualise?"
    options:
      - "The hardware, so that a whole guest operating system runs on emulated devices"
      - "The operating system, giving each container its own view of processes, files and network while all share one kernel"
      - "The hypervisor, so that several hypervisors can run on one machine"
      - "Only the network, so that each container gets its own IP address but shares all other resources openly"
    correct: 2

  - id: q3
    type: short
    section: sec-05-the-kernel
    difficulty: basic
    text: >
      In one or two sentences: why can a Linux container not run directly on
      a Windows or macOS kernel, and how does Docker Desktop run Linux
      containers on those laptops anyway?
    answers:
      - "the image holds libraries and binaries but no kernel, so it needs a linux kernel; docker desktop runs a small linux vm in the background"
      - "container isolation is enforced by the linux kernel; docker desktop runs the containers on a hidden linux virtual machine"
      - "windows nt and macos xnu have no built-in idea of linux containers; a small linux vm (wsl 2 or the virtualisation framework) provides the kernel"
      - "linux containers need a linux kernel; on windows via wsl 2 and on macos via the virtualisation framework a linux vm runs them"

  - id: q4
    type: mcq
    section: sec-05-the-kernel
    difficulty: basic
    text: "Which two Linux kernel mechanisms is a container built from?"
    options:
      - "A hypervisor and emulated devices"
      - "VLANs and VXLAN"
      - "Namespaces and control groups (cgroups)"
      - "System calls and loadable kernel modules"
    correct: 3

  - id: q5
    type: short
    section: sec-05-ephemeral-immutable
    difficulty: basic
    text: >
      In one or two sentences: what does it mean for a workload to be
      immutable, and what is the correct response to a compromised or
      outdated instance in that model?
    answers:
      - "a running instance is never modified in place; a new image is built and the instance replaced rather than patched"
      - "never patch in place; rebuild the image and replace the instance"
      - "replaced rather than repaired: rebuild from a fixed image and retire the compromised instance"
      - "instances are disposable and never changed in place; fix by building a new image and rolling out fresh instances"

  - id: q6
    type: mcq
    section: sec-05-why-containers-orchestration
    difficulty: basic
    text: "Why did containers rather than VMs become the unit of cloud-native deployment?"
    options:
      - "Containers give a stronger isolation boundary than virtual machines"
      - "A container starts within a second and costs megabytes, so a service can add and drop instances fast enough to follow demand"
      - "Virtual machines cannot run Linux workloads in the cloud"
      - "Containers remove the need for an orchestration system such as Kubernetes"
    correct: 2

  - id: q7
    type: applied
    section: sec-05-ephemeral-immutable
    difficulty: applied
    text: >
      Building on the chapter exercise "A vulnerable dependency": your
      Nextcloud runs as a Docker container built from an image, and a
      critical vulnerability is published for a library inside that image. A
      teammate proposes logging into the running container and patching the
      library in place, "since that is what we did on the VM in Session 2".
      Explain which world this deployment belongs to, what the correct
      control is instead, and use the Guidance's three reasons for the
      short-running model to justify why the correct control leaves the
      service more secure than the teammate's proposal.
    sample_answer: >
      The deployment is cloud-native/immutable, so the running instance is
      not patched at all; the correct control is to update the image,
      rebuild, and replace every running container, retiring the vulnerable
      ones. Patching in place is the lift-and-shift move and makes the
      running container diverge from its image. The three reasons: limited
      exposure (short-lived, replaced instances give an attacker little
      time); consistency (every instance comes from the same tested image,
      while hand-patching reintroduces drift); easier verification (one
      rebuilt image is tested once, whereas a hand-patched container must be
      assessed again and again). Full credit requires naming the world, the
      rebuild-and-replace control, and all three reasons applied to the
      scenario.
