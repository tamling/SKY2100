quiz_title: "Chapter 06 - Self-check"
chapter: 06-tls-data-in-transit

questions:
  - id: q1
    type: mcq
    section: sec-06-three-data-states
    difficulty: basic
    text: "According to the chapter, which state of data is the hardest to protect, and why?"
    options:
      - "Data at rest, because a disk can be stolen from the data centre"
      - "Data in motion, because networks are shared and untrusted"
      - "Data in use, because the program working on the data must be able to read it"
      - "Data at rest, because backups multiply the number of copies"
    correct: 3

  - id: q2
    type: mcq
    section: sec-06-two-crypto-families
    difficulty: basic
    text: "Why does TLS use asymmetric encryption only at the start of a connection and symmetric encryption for the rest?"
    options:
      - "Asymmetric encryption is fast for bulk data but cannot protect a key exchange"
      - "Symmetric encryption solves the key-sharing problem, so asymmetric encryption is needed only for signatures"
      - "Asymmetric encryption protects the key agreement over an untrusted network but is far slower, so a fresh symmetric key handles the bulk traffic"
      - "Certificates can only be verified with symmetric keys, which must be agreed first"
    correct: 3

  - id: q3
    type: short
    section: sec-06-two-crypto-families
    difficulty: basic
    text: >
      In one or two sentences: what does a digital certificate bind
      together, and who vouches for that binding?
    answers:
      - "a public key to an identity (a domain name), signed by a certificate authority both parties trust"
      - "it binds a public key to a domain name; a trusted ca vouches by its signature"
      - "public key and identity, vouched for by a certificate authority within the pki"
      - "the server's public key is bound to its domain, confirmed by the signature of a trusted ca"

  - id: q4
    type: mcq
    section: sec-06-tls
    difficulty: basic
    text: "Which three properties does TLS deliver for data in motion?"
    options:
      - "Confidentiality, integrity and server authentication"
      - "Confidentiality, availability and non-repudiation"
      - "Integrity, availability and client authentication"
      - "Confidentiality, integrity and availability"
    correct: 1

  - id: q5
    type: short
    section: sec-06-tls
    difficulty: basic
    text: >
      In one or two sentences: what is TLS inspection (break-and-inspect),
      and what does it trade away in exchange for restoring deep packet
      inspection?
    answers:
      - "decrypting traffic at a gateway, examining it and re-encrypting it onward; it breaks end-to-end confidentiality at one trusted point"
      - "tls termination at a gateway: decrypt, inspect, re-encrypt; the cost is end-to-end confidentiality and a concentration risk"
      - "break-and-inspect decrypts at a gateway to restore inspection but gives up end-to-end confidentiality"
      - "decrypt at a trusted gateway and re-encrypt onward, trading end-to-end confidentiality for visibility"

  - id: q6
    type: mcq
    section: sec-06-vpns-data-on-move
    difficulty: basic
    text: "How does the protection of a VPN differ from the protection of TLS?"
    options:
      - "A VPN encrypts data at rest on the device, whereas TLS encrypts data in motion"
      - "A VPN routes all of a device's packets through an encrypted connection to the organisation, whereas TLS protects one application's connection"
      - "A VPN authenticates the server through a certificate, whereas TLS does not authenticate anyone"
      - "A VPN is faster than TLS because it uses only symmetric encryption"
    correct: 2

  - id: q7
    type: applied
    section: sec-06-tls
    difficulty: applied
    text: >
      Building on the chapter exercise "http to https as
      threat-risk-control": after the laboratory, your Nextcloud serves
      salary_list.pdf over HTTPS, and a teammate declares the file "now
      fully protected". Using the chapter's four practical points and the
      three data states, write a short review of that claim: state what the
      HTTPS control actually protects, list at least three things it does
      not cover or that could still undermine it, and name the control or
      session that addresses each.
    sample_answer: >
      HTTPS protects the confidentiality and integrity of the file and
      credentials in motion, plus server authentication; the interceptor now
      sees only ciphertext. It does not cover (any three, each with the
      matching control/session): the file at rest on the server's disk
      (storage encryption and backups, Session 11); the file in use and who
      may open it (access control, Session 7); an application flaw such as
      SQL injection that returns decrypted data (application security,
      Session 8 - encryption bypassed, not broken); old TLS versions left
      enabled (enforce TLS 1.2 minimum, disable 1.0/1.1); an expired
      certificate breaking the service; private keys kept beside the
      application instead of a managed key store (Azure Key Vault, AWS
      KMS). Full credit needs the in-motion scope plus three distinct gaps
      each paired with a control or session.
