quiz_title: "Chapter 08 — Self-check"
chapter: 08-devsecops-waf

questions:
  - id: q1
    type: mcq
    section: sec-08-application-security
    difficulty: basic
    text: "During an incident involving a newly disclosed library vulnerability, what is the one question the software bill of materials (SBOM) answers?"
    options:
      - "Whether the WAF has already blocked exploitation attempts against the library"
      - "Whether and where the vulnerable library is in use in one's applications"
      - "Whether the library's authors have released a patch"
      - "Whether the flaw is exploitable over TLS"
    correct: 2

  - id: q2
    type: mcq
    section: sec-08-secure-development-lifecycle
    difficulty: basic
    text: "What is STRIDE, as the CSA Guidance recommends it?"
    options:
      - "A deployment strategy that releases a change to a small fraction of users first"
      - "A static testing tool that scans source code for hard-coded credentials"
      - "A threat-modelling scheme that sorts threats into six categories, turning the open-ended threat question into a checklist"
      - "A set of six WAF rule categories for blocking application-layer attacks"
    correct: 3

  - id: q3
    type: short
    section: sec-08-devsecops-pipeline
    difficulty: basic
    text: "In one or two sentences each: what are canary deployment and blue/green deployment?"
    answers:
      - "canary sends the new version to a small fraction of users first and observes before rolling on"
      - "blue/green keeps two environments so a release can be switched over and back instantly"
      - "small fraction of users first"
      - "two environments, instant switch over and back"

  - id: q4
    type: mcq
    section: sec-08-devsecops-pipeline
    difficulty: basic
    text: "Where do SAST and DAST run in a DevSecOps pipeline?"
    options:
      - "SAST during continuous integration, so vulnerable code does not merge; DAST during continuous delivery, against the staged application"
      - "Both run in production, since only running code can be tested"
      - "DAST during continuous integration on the source code; SAST against the staged application"
      - "SAST in the design phase as part of threat modelling; DAST only after an incident"
    correct: 1

  - id: q5
    type: short
    section: sec-08-devsecops-pipeline
    difficulty: basic
    text: "In one or two sentences: what distinguishes a declarative infrastructure-as-code specification from an imperative one?"
    answers:
      - "imperative lists the steps to perform"
      - "declarative states the desired end state and lets the tooling reach it"
      - "steps to perform versus desired end state"
      - "declarative describes the goal, imperative the steps"

  - id: q6
    type: mcq
    section: sec-08-waf
    difficulty: basic
    text: "Which statement about the web application firewall matches the CSA Guidance's treatment of it?"
    options:
      - "It repairs flawed applications, so secure coding becomes optional once a WAF is deployed"
      - "It replaces the NGFW, since both inspect traffic"
      - "It operates at the network layer, blocking ports and source addresses"
      - "It prevents attacks from arriving at the application, but is not a way to repair a flawed application or to excuse careless development"
    correct: 4

  - id: q7
    type: applied
    section: sec-08-exercises
    difficulty: applied
    text: >
      Building on the "A disclosed library flaw" exercise: a critical
      vulnerability is disclosed in an open-source library, and the SBOM shows
      that a third-party Nextcloud plugin in production embeds it. No patch
      exists yet. Describe, in order, what the team should do in the first
      hours and in the following days, naming the runtime control that limits
      exploitation now, and explaining how the pipeline and the immutable
      infrastructure of Session 5 deliver the fix once a patched version
      appears. Justify each step with a concept from this chapter.
    sample_answer: >
      First hours: the SBOM has already answered where the library is in use
      (the Log4Shell lesson); the WAF in front of Nextcloud is the runtime
      control that limits exploitation now, inspecting HTTP requests and
      blocking those matching the attack pattern even though the flaw is
      present (runtime-defence phase of the SSDLC). Following days: the
      patched version goes through the DevSecOps pipeline — composition
      analysis confirms the new dependency, SAST in CI, DAST against the
      staged application in CD — and because the infrastructure is immutable
      and defined as code, the environment is rebuilt fresh from the tested
      definition, so what was tested is exactly what runs. Grading: full
      credit needs SBOM for locating exposure, WAF as interim shield, the
      pipeline's tests delivering the patch, and the immutability/no-drift
      argument; partial credit for three of the four.
