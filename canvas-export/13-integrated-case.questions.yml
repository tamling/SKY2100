quiz_title: "Chapter 13 - Self-check"
chapter: 13-integrated-case

questions:
  - id: q1
    type: mcq
    section: sec-13-csf-mapping
    difficulty: basic
    text: >
      Which option names the six Functions of the NIST Cybersecurity
      Framework 2.0?
    options:
      - "Prepare, Detect, Analyse, Contain, Eradicate, Recover"
      - "Govern, Identify, Protect, Detect, Respond, Recover"
      - "Baseline, Firewall, Identity, Monitoring, Logging, Backup"
      - "Confidentiality, Integrity, Availability, Risk, Audit, Compliance"
    correct: 2

  - id: q2
    type: mcq
    section: sec-13-csf-mapping
    difficulty: basic
    text: "Why is the Govern Function drawn at the centre of CSF 2.0?"
    options:
      - "It sets the strategy and policy on which the other five Functions depend"
      - "It contains the most Subcategories of any Function"
      - "It is the only Function that stands ready for the incident rather than running continuously"
      - "It replaces the Identify Function in version 2.0"
    correct: 1

  - id: q3
    type: mcq
    section: sec-13-hardened-stack
    difficulty: basic
    text: >
      According to this chapter, what makes the course's layers one system
      rather than a list?
    options:
      - "Every layer is configured from the same management console"
      - "Each layer depends on the layer beneath it working correctly"
      - "The layers are independent, so each catches what the others miss"
      - "All the layers were installed in a single session"
    correct: 3

  - id: q4
    type: short
    section: sec-13-csf-mapping
    difficulty: basic
    text: >
      In one or two sentences: what does "defensible" mean in this chapter?
      Make clear what it does not mean.
    answers:
      - "not that the service cannot be attacked"
      - "protection is complete across the framework at the level of Categories"
      - "for each Category the control, the threat it meets and the reason it belongs can be named"
      - "complete across the Categories, not attack-proof"

  - id: q5
    type: short
    section: sec-13-argument
    difficulty: basic
    text: >
      In one or two sentences: why, according to this chapter, does the
      question whether a system is secure never have a permanent yes as its
      answer?
    answers:
      - "distributed systems are complex by nature"
      - "the position must be argued again as the system changes"
      - "security lives inside the complexity of cloud-native systems"
      - "only a position argued anew, never a permanent yes"

  - id: q6
    type: mcq
    section: sec-13-csf-mapping
    difficulty: basic
    text: >
      A team's CSF mapping has entries under every Function except Detect.
      What does the chapter say this means?
    options:
      - "Nothing serious, because Detect is optional when Protect is complete"
      - "The service is blind: an empty Category is a real gap in the defence"
      - "The gap is in the mapping exercise, not in the defence"
      - "The team should merge Detect into Respond, since both stand ready for the incident"
    correct: 2

  - id: q7
    type: applied
    section: sec-13-closing-exercise
    difficulty: applied
    text: >
      Building on the chapter's closing exercise: your group's mapping shows
      three controls under Protect but nothing under Govern and nothing
      under Recover, and a groupmate argues the service is nevertheless
      defensible because "Protect is where the real security happens". Using
      this chapter's account of the six Functions and the test of
      completeness at the level of Categories, explain what is wrong with
      that argument, state what the two empty Functions mean concretely for
      the service, and name one control from the course that would populate
      each of them, defending each in the threat-risk-control vocabulary.
    sample_answer: >
      Defensible means completeness across all Functions and Categories, not
      strength in one: the layers are independent and each catches what the
      others miss. Nothing under Govern means the organisation cannot answer
      for its security (no risk register, shared-responsibility mapping or
      regulatory frame); nothing under Recover means the service cannot come
      back after an incident. Govern is populated by the risk register and
      the NIS2/DORA/ISO 22301 frame (S12) - threat: unmanaged risk and
      unmet obligations; risk: no prioritisation, no answerability; control:
      the register aligned with risk appetite. Recover is populated by
      tested backup restoration, disaster recovery and business continuity
      (S11, S12) - threat: loss prevention did not stop; risk: permanent
      loss of service and data; control: off-site, tested backups and a
      rehearsed recovery plan.
